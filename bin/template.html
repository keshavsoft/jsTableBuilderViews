<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tableBuilderViews Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 flex flex-col min-h-screen">
    <div class="max-w-6xl mx-auto w-full flex-grow">
        <div id="table-root" class="mb-8"></div>
    </div>
    
    <footer class="mt-auto py-6 flex justify-center space-x-6 text-sm text-gray-500">
        <a href="https://keshavsoft.github.io/jsTableBuilderViews/" target="_blank" class="hover:text-blue-600 transition-colors">Website</a>
        <a href="https://github.com/keshavsoft/tableBuilderViews" target="_blank" class="hover:text-gray-900 transition-colors">GitHub</a>
        <a href="https://www.npmjs.com/package/tableBuilderViews" target="_blank" class="hover:text-red-500 transition-colors">NPM</a>
    </footer>

    <script type="module">
        import { TableBuilder } from "./renderStart.js";

        // Example data - Replace with your own logic!
        const data = [{
            name: "KeshavSoft",
            founder: "Keshav Nalam",
            website: "keshavsoft.github.io/jsTableBuilderViews",
            github: "github.com/keshavsoft/tableBuilderViews",
            npm: "npmjs.com/package/tableBuilderViews"
        }];

        const columns = [
            { dataKey: "name", header: "Name", type: "string" },
            { dataKey: "founder", header: "Founder", type: "string" },
            { dataKey: "website", header: "Website", type: "string" },
            { dataKey: "github", header: "GitHub", type: "string" },
            { dataKey: "npm", header: "NPM", type: "string" }
        ];

        const tableBuilder = new TableBuilder({
            htmlId: "table-root",
            data,
            columns,
            tableOptions: {
                commonOptions: { showSerialNo: true }
            },
            views: [
                {
                    rendererType: "table",
                    theme: "style1"
                }
            ]
        });
        tableBuilder.build();
    </script>
</body>
</html>
