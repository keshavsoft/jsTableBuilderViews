    <!-- <script src="https://cdn.jsdelivr.net/gh/keshavsoft/jsTableBuilderViews@main/dist/v6/renderStart.umd.cjs"
        type="module"></script> -->

    <!-- <script src="https://keshavsoft.github.io/jsTableBuilderViews/dist/v6/renderStart.js" type="module"></script> -->

    <script src="https://keshavsoft.github.io/ks-web-components/dist/v1/ks-web-components.js" type="module"></script>

    <script src="../../renderStart.js" type="module"></script>

    <!-- To use the local version instead, swap the import below to: import { TableBuilder } from "../../renderStart.js"; -->

    <script type="module">
        let ksTable1;

        async function init() {
            try {
                // Fetch the data and columns files
                const [dataResponse, columnsResponse] = await Promise.all([
                    fetch("./purchases.json"),
                    fetch("./config.json")
                ]);

                if (!dataResponse.ok) {
                    throw new Error(`Failed to fetch all.json: ${dataResponse.status} ${dataResponse.statusText}`);
                }
                if (!columnsResponse.ok) {
                    throw new Error(`Failed to fetch columns.json: ${columnsResponse.status} ${columnsResponse.statusText}`);
                };

                const configJson = await columnsResponse.json();

                const rawData = await dataResponse.json();
                // console.log("configJson : ", configJson, data);

                const data = rawData.flatMap(rootObj => {
                    const { allinventoryentries, ...rootKeys } = rootObj;

                    if (!allinventoryentries || !Array.isArray(allinventoryentries)) return [];

                    return allinventoryentries.flatMap(entry => {
                        const { batchallocations, ...entryKeys } = entry;

                        if (!batchallocations || !Array.isArray(batchallocations)) return [];

                        return batchallocations.map(allocation => {
                            const prefixedEntryKeys = Object.fromEntries(
                                Object.entries(entryKeys).map(([k, v]) => [`allinventoryentries.${k}`, v])
                            );

                            const prefixedAllocationKeys = Object.fromEntries(
                                Object.entries(allocation).map(([k, v]) => [`allinventoryentries.batchallocations.${k}`, v])
                            );

                            return {
                                ...rootKeys,
                                ...prefixedEntryKeys,
                                ...prefixedAllocationKeys
                            };
                        });
                    });
                });
                console.log("data : ", data[0], data.length);

                configJson.data = data;

                // debugger
                const tableBuilder = new window.ks.TableBuilder(configJson);
                tableBuilder.appendToDom();

            } catch (error) {
                console.error(error);
                document.getElementById("table-root").innerHTML = `
                    <div class="flex items-center justify-center h-full p-8 text-red-500 font-semibold bg-red-50">
                        Error loading data: ${error.message}
                    </div>
                `;
            }
        };

        init();
    </script>
</body>

</html>
